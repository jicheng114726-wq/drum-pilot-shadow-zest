  font-weight: 400;

}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #07090F; }
.frame { position: relative; overflow: hidden; background: #07090F; }
.stars, .wash, .vignette, .ship { position: absolute; }
.stars { inset: 0; width: 100%; height: 100%; }
.vignette {
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,0.62) 100%);
  pointer-events: none;
}
h1 {
  position: absolute;
  margin: 0;

  font-weight: 400;
  color: #F4EFE4;
  line-height: 1;
  letter-spacing: 0.06em;
  text-shadow: 0 0 18px rgba(126,224,255,0.55), 0 2px 0 #07090F;
  z-index: 3;
}
.rule {
  position: absolute;
  height: 3px;
  background: #E8A23A;
  z-index: 3;
  box-shadow: 0 0 10px rgba(232,162,58,0.8);
}

.frame { width: 1200px; height: 630px; }
.wash.a {

.wash.b {

.player { width: 188px; height: 357px; left: 46px; top: 146px; }
.enemy { width: 228px; height: 182px; left: 958px; top: 214px; }
h1 {

  right: 0;
  top: 50%;
  width: 100%;
  transform: translateY(-50%);
  font-size: 300px;
  margin: 0;
  text-align: center;
  white-space: nowrap;
}
.rule {
  left: 50%;
  top: 492px;
  width: 188px;

}
