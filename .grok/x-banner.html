* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #07090F; }
.frame { position: relative; overflow: hidden; background: #07090F; }
.stars, .wash, .vignette, .ship { position: absolute; }
.stars { inset: 0; width: 100%; height: 100%; }
.vignette {

}
h1 {

  text-shadow: 0 0 18px rgba(126,224,255,0.55), 0 2px 0 #07090F;
  z-index: 3;
}
.rule {

  height: 3px;
  background: #E8A23A;
